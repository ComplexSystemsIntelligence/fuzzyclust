# On a published GitHub release (tag vX.Y): build the distributions, upload
# them to PyPI through trusted publishing, and attach them and the book PDF to
# the release. Zenodo archives the release and assigns it a DOI.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$v" = "${{ github.event.release.tag_name }}"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fuzzyclust/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  assets:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the distributions and the book to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          files=(dist/*)
          book="fuzzyclust-${TAG#v}-book.pdf"
          if git show origin/gh-pages:fuzzyclust-book.pdf > "$book"; then files+=("$book"); fi
          gh release upload "$TAG" "${files[@]}" --clobber
